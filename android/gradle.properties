org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Host of the public booking site. Links on this host open in the app (Android App Links).
salon.bookingHost=book.example.com
# Debug builds talk to a backend on the development machine (10.0.2.2 is the host from the emulator).
salon.debugApiBaseUrl=http://10.0.2.2:8080/
salon.releaseApiBaseUrl=https://app.example.com/
