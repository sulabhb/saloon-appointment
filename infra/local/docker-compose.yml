# Local PostgreSQL for running the backend: docker compose -f infra/local/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salon
      # Owner role: runs Flyway migrations.
      POSTGRES_USER: salon_owner
      POSTGRES_PASSWORD: salon_owner
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - salon-postgres:/var/lib/postgresql/data

  # Catches the emails the backend sends: run the backend with SALON_NOTIFICATIONS_DELIVERY=smtp
  # SPRING_MAIL_HOST=localhost SPRING_MAIL_PORT=1025, then open http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  salon-postgres:
